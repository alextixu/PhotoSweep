# 備用方案：PhotoSweep.xcodeproj 已可直接用 Xcode 16+ 開啟。
# 只有在它打不開時，才在 Mac 上執行：
#   brew install xcodegen
#   xcodegen generate
# 重新產生 PhotoSweep.xcodeproj（會覆蓋原本的專案檔）。
name: PhotoSweep
options:
  bundleIdPrefix: com.lintaixu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PhotoSweep:
    type: application
    platform: iOS
    sources:
      - path: PhotoSweep
    info:
      # 產生到 PhotoSweep/ 資料夾外面，避免和字串目錄 InfoPlist.xcstrings 打架
      path: xcodegen/Info.plist
      properties:
        CFBundleDisplayName: PhotoSweep
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-Hans]
        NSPhotoLibraryUsageDescription: PhotoSweep shows your photos so you can decide which ones to keep. Nothing is deleted until you empty the trash.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.lintaixu.PhotoSweep
schemes:
  PhotoSweep:
    build:
      targets:
        PhotoSweep: all
    run:
      config: Debug
