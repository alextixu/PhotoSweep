<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #000; --cell: #1c1c1e; --cell2: #2c2c2e; --sep: #38383a;
    --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
    --accent: #6e6cff; --green: #30d158; --red: #ff453a; --blue: #0a84ff;
    --orange: #ff9f0a; --pink: #ff375f; --purple: #bf5af2; --fill3: rgba(118,118,128,.24);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 393px; height: 852px; overflow: hidden; background: var(--bg); color: var(--label);
    font-family: "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .ti { line-height: 1; }
  .screen { position: relative; width: 393px; height: 852px; overflow: hidden; }
  .status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 14px 32px 0 42px; font-weight: 600; font-size: 17px; }
  .status .icons { display: flex; gap: 6px; align-items: center; font-size: 17px; }
  .battery { width: 27px; height: 13px; border: 1.5px solid rgba(255,255,255,.45); border-radius: 4px; padding: 1.5px; position: relative; }
  .battery::after { content: ""; position: absolute; right: -4px; top: 3.5px; width: 2px; height: 4px; background: rgba(255,255,255,.45); border-radius: 0 1px 1px 0; }
  .battery i { display: block; height: 100%; width: 80%; background: #fff; border-radius: 2px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px; border-radius: 3px; background: #fff; }
  .navbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: var(--accent); font-size: 17px; }
  .navbar .title { color: var(--label); font-weight: 600; position: absolute; left: 50%; transform: translateX(-50%); }
  .navbar .ti { font-size: 24px; }
  .back { display: flex; align-items: center; gap: 2px; }
  .back .ti { font-size: 28px; margin-left: -8px; }
  .large-title { font-size: 34px; font-weight: 700; padding: 2px 16px 8px; letter-spacing: .2px; }
  .section-h { font-size: 13px; color: var(--label2); text-transform: uppercase; padding: 18px 32px 7px; }
  .group { background: var(--cell); border-radius: 10px; margin: 0 16px; overflow: hidden; }
  .stats { display: flex; padding: 12px 0; }
  .stat { flex: 1; text-align: center; }
  .stat + .stat { border-left: .5px solid var(--sep); }
  .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--label2); }
  .tiles { display: flex; gap: 12px; padding: 0 16px; overflow: hidden; }
  .tile { flex: none; width: 128px; height: 104px; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .tile .ti { font-size: 26px; }
  .tile b { font-size: 15px; font-weight: 600; display: block; }
  .tile span { font-size: 12px; opacity: .85; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 84px; right: 0; border-top: .5px solid var(--sep); }
  .row img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { font-size: 17px; font-weight: 600; display: block; }
  .row .txt span { font-size: 15px; color: var(--label2); display: block; margin: 2px 0 6px; }
  .bar { height: 4px; border-radius: 2px; background: var(--fill3); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .chev { color: var(--label3); font-size: 18px; }
  .trashbar { position: absolute; left: 16px; right: 16px; bottom: 30px; height: 52px; border-radius: 16px; background: rgba(44,44,46,.92);
    border: 1px solid rgba(255,69,58,.35); color: var(--red); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 17px; }
  .trashbar b { font-weight: 600; flex: 1; }
  /* swipe */
  .phead { padding: 8px 16px 0; }
  .phead .l { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .phead .l b { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .phead .l span { font-size: 12px; color: var(--label2); }
  .stack { position: absolute; top: 160px; left: 16px; right: 16px; height: 528px; }
  .card { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: #000; box-shadow: 0 8px 16px rgba(0,0,0,.5); }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 38px 14px 14px; background: linear-gradient(transparent, rgba(0,0,0,.78)); }
  .card .foot b { font-size: 15px; font-weight: 600; display: block; }
  .card .foot span { font-size: 12px; opacity: .8; }
  .badges { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .badge { background: rgba(60,60,67,.6); border-radius: 99px; padding: 5px 9px; font-size: 12px; font-weight: 600; display: flex; gap: 4px; align-items: center; }
  .fav { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: rgba(60,60,67,.6); display: grid; place-items: center; color: var(--pink); font-size: 18px; }
  .stamp { position: absolute; top: 30px; left: 26px; border: 4px solid var(--green); color: var(--green); border-radius: 8px; padding: 2px 12px;
    font-size: 34px; font-weight: 900; letter-spacing: 1px; transform: rotate(-15deg); background: rgba(0,0,0,.15); }
  .stamp.trash { left: auto; right: 26px; border-color: var(--red); color: var(--red); transform: rotate(15deg); }
  .controls { position: absolute; bottom: 42px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 24px; }
  .cbtn { border-radius: 50%; background: rgba(58,58,60,.85); display: grid; place-items: center; box-shadow: 0 3px 6px rgba(0,0,0,.4); }
  .cbtn.s { width: 52px; height: 52px; font-size: 22px; }
  .cbtn.l { width: 68px; height: 68px; font-size: 30px; }
  /* trash */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 0 3px; }
  .cell { position: relative; aspect-ratio: 1; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .rs { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .cell .vid { position: absolute; bottom: 6px; left: 6px; font-size: 14px; text-shadow: 0 0 3px #000; }
  .delbar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(22,22,24,.96); border-top: .5px solid var(--sep); padding: 14px 16px 34px; text-align: center; }
  .delbar .sz { font-size: 13px; color: var(--label2); margin-bottom: 10px; }
  .delbtn { background: var(--red); color: #fff; border-radius: 12px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .delbar .cap { font-size: 11px; color: var(--label3); margin-top: 10px; line-height: 1.4; }
  /* permission */
  .perm { padding: 0 24px; height: 798px; display: flex; flex-direction: column; }
  .perm .hero { text-align: center; margin-top: 60px; }
  .perm .hero .ti { font-size: 76px; color: var(--accent); }
  .perm h1 { font-size: 32px; font-weight: 700; margin: 22px 0 10px; }
  .perm p.sub { color: var(--label2); font-size: 17px; line-height: 1.35; text-wrap: balance; }
  .feats { margin-top: 30px; display: flex; flex-direction: column; gap: 18px; padding: 0 8px; }
  .feat { display: flex; gap: 14px; align-items: flex-start; }
  .feat .ti { font-size: 28px; width: 32px; flex: none; display: inline-block; text-align: center; }
  .feat b { font-size: 17px; font-weight: 600; display: block; }
  .feat span { font-size: 15px; color: var(--label2); line-height: 1.3; }
  .cta { margin-top: auto; background: var(--accent); color: #fff; height: 50px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; font-weight: 600; }
  .foot-note { text-align: center; font-size: 12px; color: var(--label3); margin: 14px 0 26px; }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
const P = new URLSearchParams(location.search);
const screenName = P.get('screen') || 'home';
const lang = P.get('lang') || 'zh';
const T = {
  zh: {
    reviewed: '已檢視', inTrash: '垃圾桶', freed: '已釋放', quick: '快速開始', byMonth: '依月份',
    random: '隨機', shots: '螢幕截圖', videos: '影片', favs: '最愛', items: n => `${n} 個項目`,
    months: ['2026年9月', '2026年8月', '2026年7月', '2026年6月', '2026年5月'],
    mrow: (n, r) => `${n} 個項目 · 已檢視 ${r}`, trashBar: n => `垃圾桶有 ${n} 個項目`, review: '檢視',
    of: (i, n) => `第 ${i} 張，共 ${n} 張`, hint: '← 丟棄 · 保留 →', keep: '保留', trashStamp: '丟棄',
    date: '2026年9月14日 下午3:42', trash: '垃圾桶', restoreAll: '全部還原',
    sz: (n, s) => `${n} 個項目 · ${s}`, del: n => `刪除 ${n} 個項目`,
    delCap: 'iOS 會再跟你確認一次；刪除的照片會在「最近刪除」保留 30 天。',
    pTitle: '整理你的照片', pSub: '一張一張看過你的照片：留下好的，丟掉多餘的。',
    f: [['右滑保留', '照片原封不動留在圖庫裡。'], ['左滑丟進垃圾桶', '先進 App 的垃圾桶，還不會真的刪除。'],
        ['雙擊加入最愛', '與「照片」App 的最愛相簿同步。'], ['準備好再清空垃圾桶', '刪除的照片會在 iOS「最近刪除」保留 30 天。']],
    start: '開始', private: '你的照片不會離開你的裝置。',
  },
  en: {
    reviewed: 'Reviewed', inTrash: 'In Trash', freed: 'Freed', quick: 'Quick Start', byMonth: 'By Month',
    random: 'Random', shots: 'Screenshots', videos: 'Videos', favs: 'Favorites', items: n => `${n} items`,
    months: ['September 2026', 'August 2026', 'July 2026', 'June 2026', 'May 2026'],
    mrow: (n, r) => `${n} items · ${r} reviewed`, trashBar: n => `${n} in trash`, review: 'Review',
    of: (i, n) => `${i} of ${n}`, hint: '← Trash · Keep →', keep: 'KEEP', trashStamp: 'TRASH',
    date: 'September 14, 2026 at 3:42 PM', trash: 'Trash', restoreAll: 'Restore All',
    sz: (n, s) => `${n} items · ${s}`, del: n => `Delete ${n} Items`,
    delCap: 'iOS will ask you to confirm. Deleted photos stay in Recently Deleted for 30 days.',
    pTitle: 'Tidy up your photos', pSub: 'Go through your library one photo at a time. Keep the good ones, toss the rest.',
    f: [['Swipe right to keep', 'The photo stays exactly where it is.'], ['Swipe left to trash', "It goes to the app's trash first. Nothing is deleted yet."],
        ['Double-tap to favorite', 'Synced with the Favorites album in Photos.'], ["Empty the trash when you're ready", 'iOS keeps deleted photos in Recently Deleted for 30 days.']],
    start: 'Get Started', private: 'Your photos never leave your device.',
  },
}[lang];

const statusBar = `<div class="status"><span>9:41</span><span class="icons"><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><span class="battery"><i></i></span></span></div>`;
const homeInd = `<div class="home-ind"></div>`;

function home() {
  const tile = (icon, name, n, color) => `<div class="tile" style="background:linear-gradient(160deg,${color},color-mix(in srgb, ${color} 70%, #000))"><i class="ti ti-${icon}"></i><div><b>${name}</b><span>${T.items(n)}</span></div></div>`;
  const row = (img, title, n, r) => {
    const done = r >= n;
    return `<div class="row"><img src="img/${img}.jpg"><div class="txt"><b>${title}</b><span>${T.mrow(n, r)}</span>
      <div class="bar"><i style="width:${Math.round(r / n * 100)}%;${done ? 'background:var(--green)' : ''}"></i></div></div>
      ${done ? '<i class="ti ti-circle-check-filled" style="color:var(--green);font-size:22px"></i>' : ''}<i class="ti ti-chevron-right chev"></i></div>`;
  };
  return `${statusBar}
  <div class="navbar"><i class="ti ti-settings"></i><i class="ti ti-trash-filled"></i></div>
  <div class="large-title">PhotoSweep</div>
  <div class="group stats">
    <div class="stat"><b style="color:var(--blue)">1,284</b><span>${T.reviewed}</span></div>
    <div class="stat"><b style="color:var(--red)">37</b><span>${T.inTrash}</span></div>
    <div class="stat"><b style="color:var(--green)">2.1 GB</b><span>${T.freed}</span></div>
  </div>
  <div class="section-h">${T.quick}</div>
  <div class="tiles">${tile('arrows-shuffle', T.random, '8,412', '#9b59f5')}${tile('screenshot', T.shots, 932, '#0a84ff')}${tile('video', T.videos, 214, '#ff9f0a')}${tile('heart', T.favs, 156, '#ff375f')}</div>
  <div class="section-h">${T.byMonth}</div>
  <div class="group">
    ${row('sq1', T.months[0], 312, 120)}${row('sq6', T.months[1], 486, 486)}${row('sq3', T.months[2], 251, 64)}${row('sq9', T.months[3], 198, 0)}${row('sq2', T.months[4], 233, 0)}
  </div>
  <div class="trashbar"><i class="ti ti-trash-filled"></i><b>${T.trashBar(37)}</b><span>${T.review}</span><i class="ti ti-chevron-right" style="font-size:15px"></i></div>
  ${homeInd}`;
}

function swipe() {
  return `${statusBar}
  <div class="navbar"><span class="back"><i class="ti ti-chevron-left"></i></span><span class="title">${T.months[0]}</span>
    <span style="display:flex;gap:16px;align-items:center"><span style="display:flex;gap:4px;align-items:center"><i class="ti ti-trash-filled" style="font-size:22px"></i>37</span><i class="ti ti-dots-circle-horizontal"></i></span></div>
  <div class="phead"><div class="l"><b>${T.of(121, 312)}</b><span>${T.hint}</span></div><div class="bar"><i style="width:38.5%"></i></div></div>
  <div class="stack">
    <div class="card" style="transform:translateY(8px) scale(.965)"><img src="img/card_next.jpg"></div>
    <div class="card" style="transform:translate(62px,6px) rotate(3.4deg);transform-origin:50% 100%">
      <img src="img/card_main.jpg">
      <div class="badges"><span class="badge"><i class="ti ti-live-photo"></i>LIVE</span><span class="fav"><i class="ti ti-heart-filled"></i></span></div>
      <div class="stamp">${T.keep}</div>
      <div class="foot"><b>${T.date}</b><span>4032 × 3024 · 3.2 MB</span></div>
    </div>
  </div>
  <div class="controls">
    <div class="cbtn s" style="color:var(--label2)"><i class="ti ti-arrow-back-up"></i></div>
    <div class="cbtn l" style="color:var(--red)"><i class="ti ti-trash-filled"></i></div>
    <div class="cbtn l" style="color:var(--green)"><i class="ti ti-check" style="font-weight:700"></i></div>
    <div class="cbtn s" style="color:var(--pink)"><i class="ti ti-heart-filled"></i></div>
  </div>
  ${homeInd}`;
}

function trash() {
  const imgs = ['shot', 'sq4', 'sq7', 'sq10', 'shot', 'sq11', 'sq8', 'sq12', 'sq5', 'sq2', 'shot', 'sq9', 'sq3', 'sq6', 'sq1'];
  const cells = imgs.map((s, i) => `<div class="cell"><img src="img/${s}.jpg"><span class="rs"><i class="ti ti-arrow-back-up"></i></span>${i === 3 || i === 8 ? '<i class="ti ti-video vid"></i>' : ''}</div>`).join('');
  return `${statusBar}
  <div class="navbar"><span class="back"><i class="ti ti-chevron-left"></i>PhotoSweep</span><span class="title">${T.trash}</span><span>${T.restoreAll}</span></div>
  <div class="grid" style="margin-top:6px">${cells}</div>
  <div class="delbar"><div class="sz">${T.sz(37, '412 MB')}</div><div class="delbtn"><i class="ti ti-trash-filled"></i>${T.del(37)}</div><div class="cap">${T.delCap}</div></div>
  ${homeInd}`;
}

function permission() {
  const icons = [['hand-finger-right', 'var(--green)'], ['hand-finger-left', 'var(--red)'], ['heart-filled', 'var(--pink)'], ['trash-filled', 'var(--orange)']];
  const feats = T.f.map((f, i) => `<div class="feat"><i class="ti ti-${icons[i][0]}" style="color:${icons[i][1]}"></i><div><b>${f[0]}</b><span>${f[1]}</span></div></div>`).join('');
  return `${statusBar}
  <div class="perm"><div class="hero"><i class="ti ti-stack-2"></i><h1>${T.pTitle}</h1><p class="sub">${T.pSub}</p></div>
  <div class="feats">${feats}</div><div class="cta">${T.start}</div><div class="foot-note">${T.private}</div></div>
  ${homeInd}`;
}

document.getElementById('screen').innerHTML = { home, swipe, trash, permission }[screenName]();
</script>
</body>
</html>
