# 在 GitHub 的 macOS 機器上編譯出「未簽名」的 PhotoSweep.ipa，
# 下載後用 Sideloadly（Windows）以自己的 Apple ID 簽名並安裝到 iPhone。
name: Build unsigned IPA

# 只在手動觸發時建置（Actions 分頁按「Run workflow」，或 gh workflow run build-ipa.yml）。
# private repo 的 macOS 分鐘數以 10 倍計算，只改 README 之類的推送不必每次都編。
on:
  workflow_dispatch:

jobs:
  build:
    # Apple 自 2026-04-28 起要求以 Xcode 26 / iOS 26 SDK 建置；側載版也用同一套，行為才會一致
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build (no code signing)
        run: |
          xcodebuild -project PhotoSweep.xcodeproj \
            -target PhotoSweep \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PhotoSweep.app Payload/
          zip -qr PhotoSweep-unsigned.ipa Payload
          ls -lh PhotoSweep-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-unsigned-ipa
          path: PhotoSweep-unsigned.ipa
          retention-days: 30
