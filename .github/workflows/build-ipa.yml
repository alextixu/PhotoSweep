# 在 GitHub 的 macOS 機器上編譯出「未簽名」的 PhotoSweep.ipa，
# 下載後用 Sideloadly（Windows）以自己的 Apple ID 簽名並安裝到 iPhone。
name: Build unsigned IPA

on:
  workflow_dispatch:      # Actions 分頁手動按「Run workflow」
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15     # 內建 Xcode 16
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild -project PhotoSweep.xcodeproj \
            -target PhotoSweep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoSweep.app Payload/
          zip -qr PhotoSweep-unsigned.ipa Payload
          ls -lh PhotoSweep-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSweep-unsigned-ipa
          path: PhotoSweep-unsigned.ipa
          retention-days: 30
